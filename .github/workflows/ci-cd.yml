name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "18"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/medical-handwriting-ocr

jobs:
  # ──────────────────────────────────────────────
  # Lint & Static Analysis
  # ──────────────────────────────────────────────
  lint-python:
    name: "Lint: Python (ruff + flake8)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear flake8-isort black isort
          pip install -r backend/requirements.txt

      - name: Run isort (check mode)
        working-directory: backend
        run: isort --check-only --diff app/

      - name: Run black (check mode)
        working-directory: backend
        run: black --check --line-length 88 app/

      - name: Run flake8
        working-directory: backend
        run: |
          flake8 app/ \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --exclude=app/__pycache__,app/.cache \
            --statistics

      - name: Run ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ --line-length=88

  lint-frontend:
    name: "Lint: Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint (if config present)
        working-directory: frontend
        run: |
          if [ -f package.json ] && grep -q eslint package.json; then
            npm ci
            npm run lint
          else
            echo "No ESLint config found, skipping frontend lint"
          fi

      - name: Check for console.log statements
        working-directory: frontend
        run: |
          if rg 'console\.(log|warn|error|debug)' js/ --no-ignore; then
            echo "::warning::Found console.log statements in frontend code"
          fi

  # ──────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────
  test-unit:
    name: "Test: Unit Tests"
    runs-on: ubuntu-latest
    needs: lint-python
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ocr_test_user
          POSTGRES_PASSWORD: ocr_test_password
          POSTGRES_DB: medical_ocr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ocr_test_user -d medical_ocr_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: quay.io/minio/minio
        env:
          MINIO_ROOT_USER: testminioadmin
          MINIO_ROOT_PASSWORD: testminioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        command: server /data --console-address ":9001"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-timeout pytest-asyncio httpx factory-boy

      - name: Copy test environment
        run: cp .env.test .env

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://ocr_test_user:ocr_test_password@localhost:5432/medical_ocr_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: testminioadmin
          MINIO_SECRET_KEY: testminioadmin123
          MINIO_BUCKET: test-ocr-crops
          MINIO_SECURE: "false"
          TESTING: "true"
        run: |
          pytest tests/ \
            -m "not integration and not slow" \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            --timeout=60 \
            --tb=short \
            -v

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit-tests
          fail_ci_if_error: false

  test-integration:
    name: "Test: Integration Tests"
    runs-on: ubuntu-latest
    needs: lint-python
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ocr_test_user
          POSTGRES_PASSWORD: ocr_test_password
          POSTGRES_DB: medical_ocr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ocr_test_user -d medical_ocr_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: quay.io/minio/minio
        env:
          MINIO_ROOT_USER: testminioadmin
          MINIO_ROOT_PASSWORD: testminioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        command: server /data --console-address ":9001"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-timeout pytest-asyncio httpx factory-boy

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://ocr_test_user:ocr_test_password@localhost:5432/medical_ocr_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: testminioadmin
          MINIO_SECRET_KEY: testminioadmin123
          MINIO_BUCKET: test-ocr-crops
          MINIO_SECURE: "false"
          TESTING: "true"
        run: |
          pytest tests/ \
            -m "integration" \
            --timeout=300 \
            --tb=short \
            -v

  # ──────────────────────────────────────────────
  Security Scan
  # ──────────────────────────────────────────────
  security-scan:
    name: "Security: Dependency Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        working-directory: backend
        run: safety check -r requirements.txt --json > safety-report.json || true

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  # ──────────────────────────────────────────────
  Docker Build
  # ──────────────────────────────────────────────
  docker-build:
    name: "Build: Docker Images"
    runs-on: ubuntu-latest
    needs: [test-unit, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  Deploy
  # ──────────────────────────────────────────────
  deploy:
    name: "Deploy: Staging / Production"
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production (placeholder)
        run: |
          echo "::notice::Deployment pipeline placeholder"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo ""
          echo "Replace this step with your actual deployment:"
          echo "  - SSH to production server"
          echo "  - docker compose pull && docker compose up -d"
          echo "  - Run alembic migrations"
          echo "  - Verify health endpoint"
          echo ""
          echo "Example:"
          echo '  ssh deploy@prod-server "cd /opt/medical-ocr && docker compose pull && docker compose up -d"'

      - name: Health check (placeholder)
        run: |
          echo "::notice::Health check placeholder"
          echo "curl -f https://your-production-domain.com/health || exit 1"
          echo "Expected: {\"status\": \"healthy\", \"version\": \"1.0.0\"}"

      - name: Notify deployment (placeholder)
        if: always()
        run: |
          echo "::notice::Notification placeholder"
          echo "Send Slack/Discord notification about deployment result"
