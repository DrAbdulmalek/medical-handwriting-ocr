# .github/workflows/mobile-build.yml
# CI/CD for MedOCR Mobile — Build APK on every push

name: Mobile Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - 'backend/**'
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      working-directory: ./mobile
      run: npm ci

    - name: Build React app
      working-directory: ./mobile
      run: npm run build

    - name: Sync Capacitor
      working-directory: ./mobile
      run: npx cap sync android

    - name: Build Debug APK
      working-directory: ./mobile/android
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: MedOCR-debug-apk
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Build Release APK (unsigned)
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease
      if: github.ref == 'refs/heads/main'

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/main'
      with:
        name: MedOCR-release-apk
        path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

  firebase-distribute:
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: MedOCR-debug-apk
        path: ./apk

    - name: Setup Firebase CLI
      run: npm install -g firebase-tools

    - name: Distribute to Firebase
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        firebase appdistribution:distribute ./apk/app-debug.apk \
          --app "${{ secrets.FIREBASE_APP_ID }}" \
          --groups "testers" \
          --release-notes "Build ${{ github.sha }}"
