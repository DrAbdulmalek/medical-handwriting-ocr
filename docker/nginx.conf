# ─────────────────────────────────────────────────────────────────────
# Nginx — Medical Handwriting OCR
# ─────────────────────────────────────────────────────────────────────
# Listens on port 80 (HTTP) and 443 (HTTPS — placeholder certs).
# Proxies /api/* and /docs/* to the FastAPI backend.
# Serves the static frontend from /usr/share/nginx/html.
# Supports WebSocket upgrade for future real-time features.
# ─────────────────────────────────────────────────────────────────────

# ── Upstream ──
upstream backend_api {
    # Docker DNS resolves "backend" to the backend container
    server backend:8000;

    # Keep-alive for connection reuse
    keepalive 32;
}

# ── Rate-limiting zones ──
# General API requests: 30 req/s per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Upload endpoint: stricter — 5 uploads/s per IP
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

# ── Gzip ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ── HTTP → HTTPS redirect (uncomment when TLS is configured) ──
# server {
#     listen 80;
#     server_name medical-ocr.example.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block (HTTP, port 80) ──
server {
    listen 80 default_server;
    server_name _;

    # Client upload size limit (medical scans can be large)
    client_max_body_size 50m;

    # Timeouts tuned for OCR processing
    proxy_connect_timeout 60s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # ── Security headers ──
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Logging ──
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ── API proxy ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # ── Upload endpoint (stricter rate limit) ──
    location /api/upload {
        limit_req zone=upload_limit burst=10 nodelay;

        proxy_pass http://backend_api/api/upload;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Larger buffers for file uploads
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 64k;

        # Allow larger uploads
        client_max_body_size 50m;
    }

    # ── Swagger / ReDoc docs ──
    location /docs {
        proxy_pass http://backend_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://backend_api/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend_api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Health check (bypass rate limits) ──
    location /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── WebSocket support (future real-time OCR status, notifications) ──
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeout (keep connections alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Frontend static files ──
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Don't cache index.html (always serve latest)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # ── Block common attack paths ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(php|sh|bash|py|cgi)$ {
        deny all;
        access_log off;
    }

    # ── Error pages ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        default_type text/html;
        return 503 '{"error": "service unavailable", "status": 503}';
    }
}

