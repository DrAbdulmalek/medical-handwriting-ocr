# ============================================
# Medical Handwriting OCR — GPU Production Profile
# ============================================
# Full pipeline with continuous learning
# Usage: docker compose -f docker/profiles/gpu-production/docker-compose.yml up -d
# Requirements: 8 CPU, 16GB RAM, NVIDIA GPU (T4+)

version: "3.8"

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - OCR_ENGINES=paddleocr,easyocr,tesseract,trocr,surya
      - USE_GPU=true
      - DATABASE_URL=postgresql://ocr:${DB_PASSWORD}@db:5432/handwriting_ocr
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS}
      - MINIO_SECRET_KEY=${MINIO_SECRET}
    volumes:
      - ocr-data:/app/data
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: handwriting_ocr
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ocr-data:
  db-data:
  redis-data:
  minio-data:
  model-cache:
  grafana-data:
