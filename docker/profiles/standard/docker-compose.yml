# ============================================
# Medical Handwriting OCR — Standard Profile
# ============================================
# Multi-engine with GPU support for staging
# Usage: docker compose -f docker/profiles/standard/docker-compose.yml up -d
# Requirements: 4 CPU, 8GB RAM, GPU (optional)

version: "3.8"

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: standard
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=staging
      - OCR_ENGINES=paddleocr,easyocr,tesseract,trocr
      - USE_GPU=true
      - DATABASE_URL=postgresql://ocr:ocr123@db:5432/handwriting_ocr
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ocr-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: handwriting_ocr
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr123
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ocr-data:
  db-data:
