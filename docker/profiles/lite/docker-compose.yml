# ============================================
# Medical Handwriting OCR — Lite Profile
# ============================================
# CPU-only, minimal engines for development/testing
# Usage: docker compose -f docker/profiles/lite/docker-compose.yml up -d
# Requirements: 2 CPU, 4GB RAM

version: "3.8"

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: lite
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - OCR_ENGINES=tesseract,easyocr
      - USE_GPU=false
      - DATABASE_URL=sqlite:///./data/ocr.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ocr-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ocr-data:
