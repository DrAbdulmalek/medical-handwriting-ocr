[pytest]

# ─────────────────────────────────────────────────────────────
# Test Discovery
# ─────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = backend

# ─────────────────────────────────────────────────────────────
# Markers
# ─────────────────────────────────────────────────────────────
#   @pytest.mark.slow       — Tests that download models or run heavy computations
#   @pytest.mark.integration — Tests requiring Docker services (postgres, minio, redis)
#   @pytest.mark.medical    — Tests exercising medical-domain logic (terminology, CER, etc.)
markers =
    slow: slow-running tests (model downloads, full pipeline, large datasets)
    integration: integration tests requiring external services (Docker containers)
    medical: medical-domain-specific tests (terminology validation, CER/WER on medical text)
    load: load/stress tests requiring extended execution time and concurrent requests

# ─────────────────────────────────────────────────────────────
# Environment Variables (injected into os.environ before tests)
# ─────────────────────────────────────────────────────────────
env =
    TESTING=true
    DATABASE_URL=postgresql://ocr_test_user:ocr_test_password@localhost:5432/medical_ocr_test
    MINIO_ENDPOINT=localhost:9000
    MINIO_ACCESS_KEY=testminioadmin
    MINIO_SECRET_KEY=test_secret_key
    MINIO_BUCKET=test-ocr-crops
    MINIO_SECURE=false
    UPLOAD_DIR=/tmp/medical_ocr_test/uploads
    CROP_DIR=/tmp/medical_ocr_test/crops
    LOG_LEVEL=DEBUG

# ─────────────────────────────────────────────────────────────
# Timeout
# ─────────────────────────────────────────────────────────────
# Default timeout per test to catch hanging operations.
# Override with: @pytest.mark.timeout(seconds=300) for slow tests.
timeout = 60

# ─────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────
# Show log output for failed tests at DEBUG level.
# Use -s / --capture=no to see all output unconditionally.
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File-level logging (written to test log file)
log_file = tests/test_output.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s %(funcName)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Quiet down noisy third-party loggers
filterwarnings =
    ignore::DeprecationWarning:paddle*
    ignore::DeprecationWarning:torch*
    ignore::UserWarning:transformers*
    ignore::FutureWarning:tensorflow*

# ─────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────
# Run with: pytest --cov=app --cov-report=term-missing
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing:skip-covered
