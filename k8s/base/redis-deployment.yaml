apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: cache
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    requirepass redis-strong-password-change-me
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    slowlog-log-slower-than 10000
    slowlog-max-len 128
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: cache
type: Opaque
data:
  REDIS_PASSWORD: "cmVkaXMtc3Ryb25nLXBhc3N3b3JkLWNoYW5nZS1tZQ=="
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: cache
    app.kubernetes.io/version: "7.2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-handwriting-ocr
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medical-handwriting-ocr
        app.kubernetes.io/component: cache
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - cache
                      - database
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: cache
                topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - redis-strong-password-change-me
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - redis-strong-password-change-me
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - redis-cli
                - -a
                - redis-strong-password-change-me
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
        - name: redis-config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
