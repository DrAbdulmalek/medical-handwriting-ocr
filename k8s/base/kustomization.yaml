apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medical-ocr

commonLabels:
  app.kubernetes.io/name: medical-handwriting-ocr
  app.kubernetes.io/part-of: medical-ocr
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  argocd.argoproj.io/sync-wave: "0"

resources:
  # Namespace
  - namespace.yaml

  # Configuration
  - configmap.yaml

  # Infrastructure
  - postgres-deployment.yaml
  - redis-deployment.yaml
  - minio-deployment.yaml

  # Application
  - backend-deployment.yaml
  - celery-deployment.yaml
  - nginx-deployment.yaml

  # Training
  - training-job.yaml

images:
  - name: medical-ocr-backend
    newTag: v1.0.0
  - name: medical-ocr-training
    newTag: v1.0.0
  - name: postgres
    newTag: "15.4-alpine"
  - name: redis
    newTag: "7.2-alpine"
  - name: minio/minio
    newTag: latest
  - name: nginx
    newTag: "1.25-alpine"

# Patches for production hardening
patches:
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/component=backend"
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: APP_ENV
                    value: "production"

  - target:
      kind: Job
      labelSelector: "app.kubernetes.io/component=training"
    patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: medical-ocr-training
      spec:
        ttlSecondsAfterFinished: 86400
