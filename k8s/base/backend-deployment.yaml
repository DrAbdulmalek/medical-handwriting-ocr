apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
type: Opaque
data:
  # echo -n '<value>' | base64
  DB_PASSWORD: "YXBwLWRhdGFiYXNlLXBhc3N3b3JkLWNoYW5nZS1tZQ=="
  REDIS_PASSWORD: "cmVkaXMtc3Ryb25nLXBhc3N3b3JkLWNoYW5nZS1tZQ=="
  S3_ACCESS_KEY: "bWluaW8tb2NyLWFjY2Vzcy1rZXktY2hhbmdlLW1l"
  S3_SECRET_KEY: "bWluaW8tb2NyLXNlY3JldC1rZXktY2hhbmdlLW1l"
  SECRET_KEY: "ZmFzdGFwaS1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9u"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-handwriting-ocr
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medical-handwriting-ocr
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: backend
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                topologyKey: topology.kubernetes.io/zone
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres 5432; do sleep 2; done
              echo "Waiting for Redis..."
              until nc -z redis 6379; do sleep 2; done
              echo "Waiting for MinIO..."
              until nc -z minio 9000; do sleep 2; done
              echo "All dependencies ready"
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
        - name: run-migrations
          image: medical-ocr-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: medical-ocr-config
            - secretRef:
                name: backend-secret
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
      containers:
        - name: backend
          image: medical-ocr-backend:latest
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "4"
            - --log-level
            - "info"
            - --access-log
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: medical-ocr-config
            - secretRef:
                name: backend-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
            ephemeral-storage: "1Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: medical-ocr
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-handwriting-ocr
      app.kubernetes.io/component: backend
