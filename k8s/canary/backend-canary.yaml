#
# Canary Deployment for Medical Handwriting OCR Backend
#
# Traffic split: 80% stable → 20% canary
# Controlled via nginx.ingress.kubernetes.io/canary annotations
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
    app.kubernetes.io/track: canary
    app.kubernetes.io/version: "v1.1.0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-handwriting-ocr
      app.kubernetes.io/component: backend
      app.kubernetes.io/track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medical-handwriting-ocr
        app.kubernetes.io/component: backend
        app.kubernetes.io/track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres 5432; do sleep 2; done
              echo "Waiting for Redis..."
              until nc -z redis 6379; do sleep 2; done
              echo "Waiting for MinIO..."
              until nc -z minio 9000; do sleep 2; done
              echo "All dependencies ready"
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
      containers:
        - name: backend
          image: medical-ocr-backend:canary-v1.1.0
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "4"
            - --log-level
            - "info"
            - --access-log
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: medical-ocr-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
    app.kubernetes.io/track: canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
    app.kubernetes.io/track: canary
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-ocr-canary-ingress
  namespace: medical-ocr
  labels:
    app.kubernetes.io/name: medical-handwriting-ocr
    app.kubernetes.io/component: backend
    app.kubernetes.io/track: canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
    # Optional: match specific headers or cookies for canary routing
    # nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    # nginx.ingress.kubernetes.io/canary-by-header-value: "true"
    nginx.ingress.kubernetes.io/canary-by-cookie: "canary"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - medical-ocr.example.com
      secretName: medical-ocr-tls
  rules:
    - host: medical-ocr.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-canary
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-canary
                port:
                  number: 8000
