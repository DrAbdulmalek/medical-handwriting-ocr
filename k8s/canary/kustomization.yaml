apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medical-ocr

# Overlay on top of base
resources:
  - ../base

# Canary-specific labels
commonLabels:
  app.kubernetes.io/track: canary
  app.kubernetes.io/managed-by: kustomize

# Canary-specific annotations
commonAnnotations:
  argocd.argoproj.io/instance: medical-ocr-canary
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

# Canary resources
resources:
  - backend-canary.yaml

images:
  - name: medical-ocr-backend
    newTag: canary-v1.1.0

patchesStrategicMerge:
  - backend-canary.yaml

# Replace the main backend service with weighted routing via patches
